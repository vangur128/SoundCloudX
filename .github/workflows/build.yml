name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      run: |
        # Создаём директорию для SDK
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        
        # Скачиваем командные инструменты
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        
        # Распаковываем
        unzip -q commandlinetools-linux-11076708_latest.zip
        
        # Переименовываем папку в правильную структуру
        mv cmdline-tools cmdline-tools-temp
        mkdir -p cmdline-tools/latest
        mv cmdline-tools-temp/* cmdline-tools/latest/
        rmdir cmdline-tools-temp
        
        # Принимаем лицензии
        yes | cmdline-tools/latest/bin/sdkmanager --licenses
        
        # Устанавливаем компоненты
        cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || echo "gradlew not found"

    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        else
          gradle wrapper
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SoundCloudX-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
