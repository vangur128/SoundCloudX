name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # ЭТА СТРОКА УСКОРЯЕТ СБОРКУ В РАЗЫ!

    - name: Set up Android SDK
      run: |
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        rm -rf cmdline-tools/latest
        mkdir -p cmdline-tools/latest
        cp -r cmdline-tools/bin cmdline-tools/latest/
        cp -r cmdline-tools/lib cmdline-tools/latest/
        cp cmdline-tools/NOTICE.txt cmdline-tools/latest/
        cp cmdline-tools/source.properties cmdline-tools/latest/
        rm -rf cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties
        yes | cmdline-tools/latest/bin/sdkmanager --licenses
        cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Build APK
      run: gradle assembleDebug --no-daemon --no-configuration-cache
      env:
        GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SoundCloudX-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
